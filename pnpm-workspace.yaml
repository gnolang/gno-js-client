# This repo is a single package, not a workspace. The file exists only to
# carry the settings below, with the root listed as the sole "member".
#
# The `packages` key must be present and non-empty: pnpm 9 refuses to run
# without it ("ERROR packages field missing or empty"), which makes the repo
# uninstallable as a git dependency for anyone still on pnpm 9 — pnpm builds
# a git dependency by running `pnpm install` inside it, and that install is
# what fails. And changesets resolves its package list from these globs, so
# an empty list breaks `pnpm changeset` ("No packages found").
packages:
  - "."

allowBuilds:
  protobufjs: true
minimumReleaseAge: 720
# @gnolang/* packages are published by us, so a release that picks up one we
# just shipped (e.g. a tm2-js-client bump) shouldn't wait out the 12h cutoff.
# The cutoff still applies to every other package.
minimumReleaseAgeExclude:
  - "@gnolang/*"

# @gnolang/tm2-rpc 1.x decodes validator addresses with @cosmjs/encoding's
# fromBech32, whose default length limit (Infinity) is rejected by
# @scure/base >= 2.3.0 ("RangeError: limit: expected safe integer"). Hold
# @scure/base 2.x below that until this package depends on
# @gnolang/tm2-rpc >= 2.0.1, which passes an explicit limit; then remove this.
overrides:
  "@scure/base@2": 2.2.0
